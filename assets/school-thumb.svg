  </defs>
  <rect width="600" height="400" fill="url(#g1)"/>
  <circle cx="90" cy="80" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="540" cy="340" r="150" fill="#00c853" opacity="0.10"/>
  <ellipse cx="300" cy="330" rx="180" ry="28" fill="#1b2040" opacity="0.35"/>
  <!-- School building -->
  <rect x="210" y="140" width="180" height="150" rx="4" fill="#ffffff"/>
  <polygon points="300,80 560,170 470,170 300,110 130,170 40,170" fill="#82b1ff" opacity="0.25"/>
  <rect x="300" y="80" width="0" height="0" fill="#82b1ff" opacity="0.25"/>
  <rect x="210" y="100" width="180" height="40" rx="4" fill="#e6f4ff"/>
  <!-- Door -->
  <rect x="270" y="230" width="60" height="60" rx="30 30 0 0" fill="#5a4bd1"/>
  <circle cx="320" cy="260" r="3" fill="#ffffff"/>
  <!-- Windows -->
  <rect x="230" y="160" width="34" height="34" rx="4" fill="#d2f0e0"/>
  <rect x="286" y="160" width="34" height="34" rx="4" fill="#d2f0e0"/>
