  <!-- Book -->
  <rect x="140" y="200" width="26" height="34" rx="3" fill="#ffffff" opacity="0.8"/>
  <rect x="166" y="196" width="26" height="34" rx="3" fill="#82b1ff" opacity="0.8"/>
  <rect x="444" y="196" width="26" height="34" rx="3" fill="#ffffff" opacity="0.8"/>
  <rect x="470" y="200" width="26" height="34" rx="3" fill="#82b1ff" opacity="0.8"/>
  <!-- Pencil -->
  <g transform="translate(380,280) rotate(30)">
    <rect x="0" y="0" width="120" height="18" rx="6" fill="#f0a500"/>
