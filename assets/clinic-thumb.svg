<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00838f"/>
      <stop offset="1" stop-color="#00695c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#g1)"/>
  <circle cx="90" cy="70" r="130" fill="#ffffff" opacity="0.06"/>
  <circle cx="530" cy="350" r="150" fill="#b2dfdb" opacity="0.10"/>
  <line x1="0" y1="10" x2="600" y2="10" stroke="#ffffff" opacity="0.4" stroke-width="3"/>
  <!-- Cross symbol -->
  <g transform="translate(300,30) scale(0.5)">
    <rect x="0" y="40" width="40" height="180" rx="8" fill="#ffffff"/>
    <rect x="40" y="80" width="180" height="40" rx="8" fill="#ffffff"/>
  </g>
  <!-- Doctor figure -->
  <g transform="translate(210,150)">
    <!-- Body -->
    <rect x="20" y="90" width="120" height="90" rx="16" fill="#ffffff"/>
    <rect x="20" y="100" width="120" height="24" rx="6" fill="#4dd0e1"/>
    <!-- Head -->
    <circle cx="80" cy="55" r="38" fill="#ffe0b2"/>
    <!-- Hair -->
    <path d="M42,45 a38,38 0 0 1 76,0 l-10,-2 a28,28 0 0 0 -56,0z" fill="#5d4037"/>
    <!-- Stethoscope -->
    <path d="M60,140 a25,25 0 0 0 40,0 l0,-10 a14,14 0 0 1 28,0 l0,10 a25,25 0 0 0 40,0" stroke="#37474f" fill="none" stroke-width="7"/>
    <circle cx="80" cy="145" r="8" fill="#37474f"/>
  </g>
  <!-- Clipboard -->
  <g transform="translate(430,150)">
    <rect x="0" y="0" width="90" height="120" rx="10" fill="#ffffff"/>
    <rect x="24" y="-14" width="42" height="26" rx="6" fill="#4dd0e1"/>
    <rect x="16" y="30" width="58" height="9" rx="4" fill="#b2dfdb"/>
    <rect x="16" y="48" width="58" height="9" rx="4" fill="#b2dfdb"/>
    <rect x="16" y="66" width="40" height="9" rx="4" fill="#b2dfdb"/>
  </g>
  <!-- Plus badge -->
  <g transform="translate(470,120)">
    <circle cx="0" cy="0" r="22" fill="#00c853"/>
    <path d="M0,-13 v26 M-13,0 h26" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
